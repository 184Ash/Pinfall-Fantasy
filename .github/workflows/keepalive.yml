name: Supabase keep-alive

# Supabase free-tier projects auto-pause after ~7 days with no activity.
# This makes a trivial read against the database every 3 days to keep it warm.
# Credentials live in GitHub Actions secrets (Settings → Secrets and variables →
# Actions), NEVER in the repo:
#   SUPABASE_URL       e.g. https://your-project-ref.supabase.co
#   SUPABASE_ANON_KEY  the public anon key (re-set this if you rotate the JWT secret)
#
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity.
# If the repo goes dormant that long, run this once via "Run workflow" to re-enable it.

on:
  schedule:
    - cron: "0 6 */3 * *" # 06:00 UTC, every 3rd day
  workflow_dispatch: {} # allow manual runs (use this to confirm it's green)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trivial read to keep the project warm
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/sync_meta?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${code}"
          cat /tmp/resp.txt
          if [ "${code}" != "200" ]; then
            echo "::error::Keep-alive query failed (HTTP ${code})."
            exit 1
          fi
          echo "Keep-alive succeeded."
